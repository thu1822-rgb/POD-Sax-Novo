
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android 
      
      - name: Preparar ícones Android
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          origem = Image.open("www/assets/icon-512.png").convert("RGBA")

          tamanhos = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for densidade, tamanho in tamanhos.items():
              pasta = Path(f"android/app/src/main/res/mipmap-{densidade}")
              pasta.mkdir(parents=True, exist_ok=True)
              imagem = origem.resize((tamanho, tamanho), Image.Resampling.LANCZOS)
              imagem.save(pasta / "ic_launcher.png")

          print("Ícones Android preparados com sucesso.")
          PY


      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: POD-Sax-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
