
      - name: Preparar ícones Android
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          arquivos = [
              p for p in Path(".").rglob("*")
              if p.is_file() and p.name.lower() == "icon-512.png"
              and ".git" not in p.parts
          ]

          if not arquivos:
              raise SystemExit("Nenhum icon-512.png foi encontrado.")

          origem = arquivos[0]
          destino = Path("www/assets/icon-512.png")
          destino.parent.mkdir(parents=True, exist_ok=True)

          if origem.resolve() != destino.resolve():
              shutil.copy2(origem, destino)

          print("Imagem encontrada:", origem)
          print("Imagem copiada para:", destino)

          imagem = Image.open(destino).convert("RGBA")

          tamanhos = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for densidade, tamanho in tamanhos.items():
              pasta = Path(f"android/app/src/main/res/mipmap-{densidade}")
              pasta.mkdir(parents=True, exist_ok=True)
              pequena = imagem.resize(
                  (tamanho, tamanho),
                  Image.Resampling.LANCZOS
              )
              pequena.save(pasta / "ic_launcher.png")
              pequena.save(pasta / "ic_launcher_round.png")

          print("Ícones preparados com sucesso!")
          PY
2
