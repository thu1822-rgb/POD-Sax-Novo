name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android 
      
      
      
      - name: Preparar ícones Android
        run: |
          echo "Procurando imagem original..."
          find . -type f -iname "icon-512.png"

          python -m pip install Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          arquivos = list(Path(".").rglob("icon-512.png"))

          if not arquivos:
              raise SystemExit("Imagem icon-512.png não encontrada.")

          origem = next(
              (p for p in arquivos if p.as_posix() == "www/assets/icon-512.png"),
              arquivos[0]
          )

          print("Imagem utilizada:", origem)

          imagem = Image.open(origem).convert("RGBA")

          tamanhos = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for densidade, tamanho in tamanhos.items():
              pasta = Path(f"android/app/src/main/res/mipmap-{densidade}")
              pasta.mkdir(parents=True, exist_ok=True)
              redimensionada = imagem.resize(
                  (tamanho, tamanho),
                  Image.Resampling.LANCZOS
              )
              redimensionada.save(pasta / "ic_launcher.png")
              redimensionada.save(pasta / "ic_launcher_round.png")

          print("Ícones Android gerados!")
          PY



      
      - name: Conferir imagens no Android
        run: |
          echo "IMAGENS NA PASTA WWW:"
          find www -type f -iname "*.png"

          echo "IMAGENS COPIADAS PARA ANDROID:"
          find android/app/src/main/assets -type f


      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: POD-Sax-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
