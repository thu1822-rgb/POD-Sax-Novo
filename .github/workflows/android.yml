
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android 
      
      
      - name: Preparar ícones Android
        run: |
          python - <<'PY'
          from pathlib import Path

          arquivos = [
              p for p in Path(".").rglob("*")
              if p.is_file() and p.name.lower() == "icon-512.png"
          ]

          print("Ícones encontrados:")
          for p in arquivos:
              print(p)

          if not arquivos:
              raise SystemExit("ERRO: icon-512.png não foi encontrado no projeto.")

          origem = next(
              (p for p in arquivos if p.as_posix() == "www/assets/icon-512.png"),
              arquivos[0]
          )

          print("Usando:", origem)
          PY


      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: POD-Sax-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
