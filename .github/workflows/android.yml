
name: Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Preparar ícones Android
        run: |
          python -m pip install Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          arquivos = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and p.name.lower() == "icon-512.png"
              and ".git" not in p.parts
          ]

          if not arquivos:
              raise SystemExit("Ícone original não encontrado.")

          origem = next(
              (p for p in arquivos if p.as_posix() == "www/assets/icon-512.png"),
              arquivos[0]
          )

          destino = Path("www/assets/icon-512.png")
          destino.parent.mkdir(parents=True, exist_ok=True)

          if origem.resolve() != destino.resolve():
              shutil.copy2(origem, destino)

          imagem = Image.open(destino).convert("RGBA")

          tamanhos = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for densidade, tamanho in tamanhos.items():
              pasta = Path(
                  f"android/app/src/main/res/mipmap-{densidade}"
              )
              pasta.mkdir(parents=True, exist_ok=True)

              pequena = imagem.resize(
                  (tamanho, tamanho),
                  Image.Resampling.LANCZOS
              )

              pequena.save(pasta / "ic_launcher.png")
              pequena.save(pasta / "ic_launcher_round.png")

          print("Ícones preparados com sucesso.")
          PY

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: POD-Sax-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
